<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>leRN — inglês escrito do A1 ao C2</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura (mesma chave de src/state/theme.ts).
      try {
        var t = localStorage.getItem('lern:theme')
        if (t === 'light' || t === 'sepia' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
